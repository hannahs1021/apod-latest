<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latest NASA APOD</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
               font-family: system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  img { max-width: 100%; max-height: 100%; object-fit: contain; }
  p { margin: 8px 12px; text-align: center; font-size: 14px; }
  a { color: lightblue; }
</style>
</head>
<body>
<script>
  const FEED = "https://science.nasa.gov/feed/apod-basic/";
  const CACHE_KEY = "apod-cache-v2";
  const ROUTES = [
    u => u,
    u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
    u => "https://corsproxy.io/?" + encodeURIComponent(u)
  ];

  const tagText = (item, tag) => {
    const el = item.getElementsByTagName(tag)[0];
    return el ? el.textContent.trim() : "";
  };

  async function loadLatest() {
    let lastErr;
    for (const route of ROUTES) {
      try {
        const r = await fetch(route(FEED));
        if (!r.ok) throw new Error("HTTP " + r.status);
        const xml = new DOMParser().parseFromString(await r.text(), "text/xml");
        const item = xml.getElementsByTagName("item")[0];
        if (!item) throw new Error("No items in feed");

        let img = tagText(item, "apod:hdurl");
        if (!img) {
          const m = tagText(item, "content:encoded").match(/<img[^>]+src="([^"]+)"/i);
          if (m) img = m[1];
        }
        return { title: tagText(item, "title"), link: tagText(item, "link"), img: img };
      } catch (e) { lastErr = e; }
    }
    throw lastErr;
  }

  function show(d) {
    document.body.innerHTML = "";
    if (!d.img) {
      document.body.innerHTML =
        `<p>Today's APOD has no image (it may be a video). <a href="${d.link}" target="_blank">View on APOD</a></p>`;
      return;
    }
    const img = document.createElement("img");
    img.src = d.img;
    img.alt = d.title;
    img.onerror = () => {
      document.body.innerHTML =
        `<p>Couldn't load the image. <a href="${d.link}" target="_blank">View on APOD</a></p>`;
    };
    document.body.appendChild(img);
  }

  loadLatest()
    .then(d => {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch (e) {}
      show(d);
    })
    .catch(err => {
      console.error(err);
      let old = null;
      try { old = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) {}
      if (old) show(old);
      else document.body.innerHTML =
        `<p>Error loading APOD. <a href="https://science.nasa.gov/apod/" target="_blank">Open APOD</a></p>`;
    });
</script>
</body>
</html>
